<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f2ea" />
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Page not found — Arish Limbu</title>
    <style>
      .not-found { min-height: 76vh; display: grid; place-items: center; text-align: center; }
      .not-found-inner { max-width: 660px; padding: 48px 24px; }
      .not-found-code { color: var(--accent); font-size: .8rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
      .not-found h1 { margin: 14px 0; font-family: var(--font-display); font-size: clamp(3rem, 8vw, 6rem); letter-spacing: -.06em; }
      .not-found p { margin: 0 auto 26px; max-width: 42ch; color: var(--muted); }
    </style>
  </head>
  <body>
    <main class="not-found container">
      <div class="not-found-inner">
        <p class="not-found-code">Error 404</p>
        <h1>That page went exploring.</h1>
        <p>The address may have changed or the page may not exist. Let’s head back to the portfolio.</p>
        <a class="button button-dark" href="./">Return to the homepage <span aria-hidden="true">↗</span></a>
      </div>
    </main>
  </body>
</html>
